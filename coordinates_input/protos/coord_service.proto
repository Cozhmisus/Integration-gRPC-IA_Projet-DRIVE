syntax = "proto3";

package getpathservice;

service PathService {
    rpc StartEnv (Empty) returns (StartMessage) {}
    rpc EndEnv (Empty) returns (EndMessage) {}
    rpc GetPathToTarget (InitialData) returns (PathResponse) {}
}

message Empty {}

message StartMessage {
    string message = 1;
    repeated float max_coord = 2;
}

message EndMessage {
    string message = 1;
}

message InitialData {
    repeated float start_coord = 1;
    repeated float target_coord = 2;
    int32 timestep = 3;
}

message PathResponse {
    repeated int32 edges = 1;
    string start_type = 2;
    int32 start_index = 3;
    string target_type = 4;
    int32 target_index = 5;
    string message = 6;
}